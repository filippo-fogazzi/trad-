# Esperimento notturno memecoin SU CARTA (soldi finti, prezzi veri).
# GitHub ferma ogni lavoro dopo 6 ore, quindi la notte è divisa in due turni:
# il primo salva lo stato e fa partire lui stesso il secondo, che riparte da lì fino alle
# 07:00 italiane. (Gli orari programmati di GitHub a volte saltano: così basta che parta il primo.)
name: Notte su carta

on:
  schedule:
    - cron: "0 22 * * *"    # turno 1: 23:00 in Italia (ora solare); il turno 2 lo lancia il turno 1
  workflow_dispatch:
    inputs:
      turno:
        description: "prova, 1 (notte vera, prima parte) o 2 (seconda parte, fino alle 07:00)"
        default: "prova"
      minuti:
        description: "Durata della prova in minuti (solo per turno = prova)"
        default: "30"

permissions:
  contents: write
  actions: write

concurrency:
  group: notte
  cancel-in-progress: false

jobs:
  notte:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Gira il bot
        env:
          TURNO: ${{ inputs.turno || '1' }}
        run: |
          ORA=$(TZ=Europe/Rome date +%-H)
          if [ "$TURNO" = "prova" ]; then
            python -m bot.notte --minuti "${{ inputs.minuti }}" --nome "prova-$(date +%Y-%m-%d-%H%M)"
          elif [ "$ORA" -ge 7 ] && [ "$ORA" -lt 21 ]; then
            echo "Sono le $ORA in Italia: di giorno la notte non parte."
          elif [ "$TURNO" = "1" ]; then
            python -m bot.notte --max-minuti 340 &
            python -m bot.notte --variante b --max-minuti 340 &
            python -m bot.notte --variante c --max-minuti 340 &
            wait
          else
            python -m bot.notte &
            python -m bot.notte --variante b &
            python -m bot.notte --variante c &
            wait
          fi
      - name: Salva i risultati nel repository
        if: always()
        run: |
          git config user.name "notte-bot"
          git config user.email "notte-bot@users.noreply.github.com"
          git add risultati/notte
          git diff --cached --quiet && exit 0
          git commit -m "Risultati notte su carta $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Lancia il turno 2
        if: ${{ !cancelled() && (inputs.turno || '1') == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ORA=$(TZ=Europe/Rome date +%-H)
          if [ "$ORA" -ge 7 ] && [ "$ORA" -lt 21 ]; then echo "Già mattina: niente turno 2."; exit 0; fi
          gh workflow run notte.yml --ref "${{ github.ref_name }}" -f turno=2
