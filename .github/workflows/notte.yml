# Bot SU CARTA (soldi finti, prezzi veri), 24 ore su 24. Giocano SOLO le strategie promosse dal Laboratorio
# (le prime 3): se non ce n'è nessuna, i bot restano fermi.
# GitHub ferma ogni lavoro dopo 6 ore: i bot girano a turni di 340 minuti, salvano lo stato e
# ogni turno fa partire da solo il successivo. Ogni giornata va dalle 07:00 alle 07:00 italiane
# e riparte con 50 € finti. L'orario programmato è solo una riserva se la catena si interrompe:
# se c'è già un turno in coda, GitHub ne tiene uno solo.
name: Bot su carta 24 ore

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      turno:
        description: "continua (turni a catena, 24 ore su 24) oppure prova"
        default: "prova"
      minuti:
        description: "Durata della prova in minuti (solo per turno = prova)"
        default: "30"

permissions:
  contents: write
  actions: write

concurrency:
  group: notte
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Gira i bot con le strategie promosse
        env:
          TURNO: ${{ inputs.turno || 'continua' }}
        run: |
          git config user.name "notte-bot"
          git config user.email "notte-bot@users.noreply.github.com"
          # ogni ora salva sul repository le operazioni fatte finora, così si vedono anche a turno in corso
          ( while sleep 3600; do
              git add risultati/notte && git commit -qm "Bot su carta: salvataggio intermedio $(date -u +%H:%MZ)" \
                && for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 10; done
            done ) &
          SALVA=$!
          if [ "$TURNO" = "prova" ]; then
            ORA=$(date +%Y-%m-%d-%H%M)
            python -m bot.notte --variante p1 --minuti "${{ inputs.minuti }}" --nome "prova-p1-$ORA" &
            python -m bot.notte --variante p2 --minuti "${{ inputs.minuti }}" --nome "prova-p2-$ORA" &
            python -m bot.notte --variante p3 --minuti "${{ inputs.minuti }}" --nome "prova-p3-$ORA" &
          else
            python -m bot.notte --variante p1 --max-minuti 340 &
            python -m bot.notte --variante p2 --max-minuti 340 &
            python -m bot.notte --variante p3 --max-minuti 340 &
          fi
          wait $(jobs -p | grep -v "^$SALVA$")
          pkill -P $SALVA 2>/dev/null; kill $SALVA 2>/dev/null || true
      - name: Salva i risultati nel repository
        if: always()
        run: |
          git config user.name "notte-bot"
          git config user.email "notte-bot@users.noreply.github.com"
          git add risultati/notte
          git diff --cached --quiet && exit 0
          git commit -m "Risultati bot su carta $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((RANDOM % 20 + 5)); done
      - name: Lancia il turno successivo
        if: ${{ !cancelled() && (inputs.turno || 'continua') == 'continua' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run notte.yml --ref "${{ github.ref_name }}" -f turno=continua
