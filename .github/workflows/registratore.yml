# Registratore 24/7 + Laboratorio meme (solo dati, nessun ordine, nessun soldo).
# Ogni 6 ore: registra foto delle memecoin nuove per 4,5 ore, poi il laboratorio
# scarica i prezzi successivi e riprova tutte le strategie.
name: Registratore e laboratorio

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      minuti:
        description: "Minuti di registrazione"
        default: "60"

permissions:
  contents: write

concurrency:
  group: registratore
  cancel-in-progress: false

jobs:
  registra:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Registra
        run: python -m bot.notte.registro --minuti "${{ inputs.minuti || 270 }}"
      - name: Laboratorio
        if: always()
        timeout-minutes: 70
        run: python -m bot.notte.laboratorio
      - name: Salva nel repository
        if: always()
        run: |
          git config user.name "registratore-bot"
          git config user.email "registratore-bot@users.noreply.github.com"
          git add registro risultati/laboratorio_meme.md risultati/laboratorio_meme.json
          git diff --cached --quiet && exit 0
          git commit -m "Registro e laboratorio meme $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
