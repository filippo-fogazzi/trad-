# Registratore 24/7 + Laboratorio meme (solo dati, nessun ordine, nessun soldo).
# Ogni 6 ore: registra foto delle memecoin nuove per 340 minuti (quasi senza pause).
# Poi 4 macchine scaricano in parallelo i prezzi successivi (ognuna ha il suo limite
# gratuito su GeckoTerminal) e alla fine il laboratorio riprova tutte le strategie.
# Il turno dopo può iniziare a registrare mentre questo scarica i prezzi: ogni turno lancia
# lui stesso il successivo (gli orari programmati di GitHub a volte saltano). L'orario
# programmato resta come riserva: se c'è già un turno in coda, GitHub ne tiene uno solo.
name: Registratore e laboratorio

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      minuti:
        description: "Minuti di registrazione (0 = solo prezzi e laboratorio)"
        default: "60"
      continua:
        description: "Alla fine lancia il turno successivo (registrazione continua)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  registra:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: registra
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Registra
        if: ${{ (inputs.minuti || '340') != '0' }}
        run: python -m bot.notte.registro --minuti "${{ inputs.minuti || 340 }}"
      - name: Salva le foto
        if: always()
        run: |
          git config user.name "registratore-bot"
          git config user.email "registratore-bot@users.noreply.github.com"
          git add registro
          git diff --cached --quiet && exit 0
          git commit -m "Registro: foto $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((RANDOM % 20 + 5)); done
      - name: Lancia il turno successivo
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.continua) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run registratore.yml --ref "${{ github.ref_name }}" -f minuti=340 -f continua=true

  # Sveglia della notte: l'orario programmato di GitHub è arrivato con 7 ore di ritardo, quindi
  # il turno del registratore che copre le 23:00 italiane aspetta quell'ora e fa partire la notte.
  # Se parte anche l'orario programmato, GitHub mette in coda e ne tiene uno solo.
  sveglia:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    if: ${{ github.event_name == 'schedule' || inputs.continua }}
    steps:
      - name: Aspetta le 23:00 italiane e lancia la notte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ADESSO=$(date +%s)
          OBIETTIVO=$(TZ=Europe/Rome date -d "today 23:00" +%s)
          [ "$OBIETTIVO" -le "$ADESSO" ] && OBIETTIVO=$(TZ=Europe/Rome date -d "tomorrow 23:00" +%s)
          ATTESA=$((OBIETTIVO - ADESSO))
          if [ "$ATTESA" -gt $((350 * 60)) ]; then echo "La notte non cade in questo turno."; exit 0; fi
          echo "Aspetto $((ATTESA / 60)) minuti"; sleep "$ATTESA"
          gh workflow run notte.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f turno=1

  prezzi:
    needs: registra
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scarica la sua parte dei prezzi
        run: python -m bot.notte.laboratorio --solo-candele --parte ${{ matrix.parte }} --parti 4 --max-minuti 50
      - name: Salva i prezzi
        if: always()
        run: |
          git config user.name "registratore-bot"
          git config user.email "registratore-bot@users.noreply.github.com"
          git add registro/candele
          git diff --cached --quiet && exit 0
          git commit -m "Prezzi per il laboratorio (parte ${{ matrix.parte }}) $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((RANDOM % 20 + 5)); done

  laboratorio:
    needs: prezzi
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: laboratorio
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Laboratorio
        run: python -m bot.notte.laboratorio --max-minuti 10
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "registratore-bot"
          git config user.email "registratore-bot@users.noreply.github.com"
          git add registro/candele risultati/laboratorio_meme.md risultati/laboratorio_meme.json
          git diff --cached --quiet && exit 0
          git commit -m "Laboratorio meme $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((RANDOM % 20 + 5)); done
